name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Cloudflare's publicly documented "always passes" Turnstile test keypair
  # (https://developers.cloudflare.com/turnstile/troubleshooting/testing/).
  # Not a secret — lets the build produce a working contact/support form and
  # lets the e2e suite exercise the real Turnstile + siteverify round trip
  # without a live site key.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
  TURNSTILE_SECRET_KEY: '1x0000000000000000000000000000000AA'

jobs:
  checks:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
